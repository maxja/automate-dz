---
node_exporter_version: "1.8.2"
node_exporter_user: node_exporter
node_exporter_port: 9100
node_exporter_install_dir: /opt/node_exporter

promtail_version: "3.1.0"
promtail_user: promtail
promtail_config_dir: /etc/promtail
promtail_positions_dir: /var/lib/promtail

# DayZ log path shipped by Promtail — matches profiles dir in dayz_server role
dayz_log_path: /etc/dayz/profiles
